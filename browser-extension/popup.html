<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>映迹登录同步</title><style>body{width:330px;margin:0;padding:22px;box-sizing:border-box;font:13px/1.7 "Segoe UI","Microsoft YaHei",sans-serif;color:#34435e;background:linear-gradient(140deg,#f1f7ff,#f5f0ff)}h1{font-size:20px;font-weight:600;margin:0 0 6px}p{color:#73809a;margin:0 0 18px}label{display:block;margin:12px 0 5px}input,select,button{font:inherit;box-sizing:border-box;width:100%;border:1px solid #d6deed;border-radius:11px;padding:10px;background:#fff;color:#34435e}button{margin-top:18px;background:#5674bc;color:#fff;border:0;cursor:pointer}button:disabled{opacity:.6}#status{margin-top:14px;white-space:pre-wrap}small{display:block;margin-top:14px;color:#73809a}</style><h1>继续使用 Chrome 登录</h1><p>先在 Chrome 登录所选网站，再粘贴映迹提供的连接码。</p><label for="site">已登录的网站</label><select id="site"><option>bangumi.tv</option><option>bgm.tv</option><option>chii.in</option></select><label for="code">映迹连接码</label><input id="code" placeholder="YJ1-…" autocomplete="off" spellcheck="false"><button id="sync">同步登录到映迹</button><div id="status" role="status"></div><small>仅在点击同步时读取所选网站的 Cookie；仅发送到本机映迹，不保存到文件或扩展存储。</small><script src="popup.js"></script></html>
